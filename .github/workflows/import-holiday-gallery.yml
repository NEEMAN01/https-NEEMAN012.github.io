name: Import holiday gallery images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download original collage images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/galleries/holidays
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/dc0dbe96-6b33-4440-be34-34ce914a20cd.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNGU1MjVlMjE1MTFmYTc1ZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDA4NDg5N30.W_hB1_KQ2IzqjyG1i5_8d_HLk0pjob9BB7ghApCOVvg' -o assets/galleries/holidays/rosh-hashanah-1.jpg
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/646f82e9-d1a1-412d-aa50-3f65666012e2.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjFkOGMyYjY1OWMyYTNiZCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDExNzE3NH0.jN79byutiuwgAYsHpdWlzYQ0_kGd00HX7xKXj3LAhRs' -o assets/galleries/holidays/rosh-hashanah-2.jpg
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/48e158ae-e8b5-48db-9892-620a58b52b69.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYjY2MjdlY2ZhMDBmNmQxNCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDA4NzUwM30.ESRj_YV50ib6CrmYUOCRfZoV6zeV8drHJB3ptwtCz7c' -o assets/galleries/holidays/rosh-hashanah-3.jpg
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/ba6402fd-1ce9-471f-8fe7-6533d17a9acb.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYjU3NzQwNDIyZmM1Mjg3NCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDEzNjEzMH0._I9rWdjaH_NNlijryfDLUZn66OD095z6wtN-33pT1wM' -o assets/galleries/holidays/rosh-hashanah-4.jpg
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/0adda63e-648a-4bd2-840b-c35766d4ea80.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOTg2ZTUzN2M5NWQ1MDFjNyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDEzNTE2NH0.p_PVFHCZbmBENBW1O9N0ReqxFDG1HkSX66qovKrzWNo' -o assets/galleries/holidays/rosh-hashanah-5.jpg

      - name: Commit gallery images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/galleries/holidays/rosh-hashanah-*.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add original Rosh Hashanah collage images [gallery-import]'
          git push
