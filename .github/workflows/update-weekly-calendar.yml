name: Update Torah and Israel Calendar snapshot

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-calendar-snapshot
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build latest local snapshot
        run: node scripts/update-weekly-snapshot.mjs

      - name: Commit only when calendar changed
        run: |
          if git diff --quiet -- weekly-snapshot.json; then
            echo "Calendar snapshot is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly-snapshot.json
          git commit -m "Update Torah & Israel Calendar snapshot"
          git push
