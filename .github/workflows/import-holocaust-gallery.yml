name: Import Holocaust Survivors gallery collage

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-image:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download full-quality Holocaust Survivors collage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/galleries/holocaust
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/d49aec28-4d7b-4b57-b38c-831760b9a92c.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMGIzYmJjOWQyMDljNWI3MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDE0NzQ4NX0.l6fdHiO_xNgajHPX7oUAvY7T6HlneNboBHlr8ycft2A' -o assets/galleries/holocaust/holocaust-overview.png
          file assets/galleries/holocaust/holocaust-overview.png
          test "$(wc -c < assets/galleries/holocaust/holocaust-overview.png)" -gt 1000000

      - name: Commit collage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/galleries/holocaust/holocaust-overview.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Import full-quality Holocaust Survivors collage [gallery-import]'
          git push
