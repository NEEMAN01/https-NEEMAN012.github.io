name: Import full-quality Our Friends collage

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-friends:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download full-quality Our Friends collage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/galleries/friends
          curl -L --fail --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Ibd89dgpCttas0LZ5xvA6a3O4e/d6e03b3e-a541-4efd-9ee3-28fdf897021e.png' -o assets/galleries/friends/friends-overview.png

      - name: Commit Our Friends collage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/galleries/friends/friends-overview.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Replace Our Friends collage with full-quality image'
          git push
