name: Import full-quality College collage

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-college:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download full-quality College collage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/galleries/college
          curl -L --fail --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3Ibd89dgpCttas0LZ5xvA6a3O4e/240d0a13-e755-401a-9fc7-d432a32b9eda.png' -o assets/galleries/college/college-overview.png

      - name: Commit College collage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/galleries/college/college-overview.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Replace College collage with full-quality image'
          git push
