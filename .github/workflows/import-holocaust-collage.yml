name: Import Holocaust Survivors collage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-holocaust-collage.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download original Holocaust Survivors collage
        env:
          SOURCE_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/b51520e0-cb10-4cdd-a0b3-07d9cc7973bc.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZmQxZDVkNWNhMjM0NDdlOSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDEyMTY5Mn0.MRoUJGQW5H10l8wyxlGTEUOgt7lmYsjLKhTQOxFafsY"
        run: |
          set -euo pipefail
          mkdir -p assets/galleries/holocaust
          curl -L --fail --retry 3 "$SOURCE_URL" -o assets/galleries/holocaust/holocaust-overview.png
          file assets/galleries/holocaust/holocaust-overview.png
          ls -lh assets/galleries/holocaust/holocaust-overview.png

      - name: Refresh gallery reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("holocaust-survivors-gallery.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("holocaust-overview.png?v=20260921-9", "holocaust-overview.png?v=20260921-16")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit full-quality collage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/galleries/holocaust/holocaust-overview.png holocaust-survivors-gallery.html
          git rm .github/workflows/import-holocaust-collage.yml
          git commit -m "Restore full-quality Holocaust Survivors collage"
          git push
